<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="bgEquipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2F4D"/>
      <stop offset="50%" stop-color="#244570"/>
      <stop offset="100%" stop-color="#0E1E34"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C9ED6"/>
      <stop offset="100%" stop-color="#70D3FF"/>
    </linearGradient>
    <filter id="glowE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Fond du panneau Twitch -->
  <rect width="320" height="100" rx="14" fill="#0C1829" stroke="#FFD000" stroke-width="2.5"/>
  <rect x="3" y="3" width="314" height="94" rx="12" fill="url(#bgEquipe)" opacity="0.35"/>
  
  <!-- Ligne cyan décorative -->
  <rect x="0" y="94" width="320" height="6" rx="3" fill="url(#accentCyan)"/>
  
  <!-- Icône Bouclier Équipe -->
  <g transform="translate(18, 22)" filter="url(#glowE)">
    <circle cx="26" cy="26" r="26" fill="#FFD000" opacity="0.25"/>
    <path d="M26 10 L40 16 L40 28 C40 38, 26 44, 26 44 C26 44, 12 38, 12 28 L12 16 Z" fill="#FFD000" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M26 18 L26 36 M19 27 L33 27" stroke="#0C1829" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Textes -->
  <text x="82" y="44" font-family="'Montserrat', sans-serif, Arial" font-size="20" font-weight="900" fill="#FFD000" letter-spacing="0.5" filter="url(#glowE)">NOTRE ÉQUIPE</text>
  <text x="82" y="68" font-family="'Montserrat', sans-serif, Arial" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">LES ALLIÉS DU SOLEIL</text>
</svg>