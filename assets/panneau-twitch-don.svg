<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="bgDon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7CA2"/>
      <stop offset="50%" stop-color="#1C9ED6"/>
      <stop offset="100%" stop-color="#0B5675"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Fond du panneau Twitch -->
  <rect width="320" height="100" rx="14" fill="#0C1829" stroke="#1C9ED6" stroke-width="2.5"/>
  <rect x="3" y="3" width="314" height="94" rx="12" fill="url(#bgDon)" opacity="0.22"/>
  
  <!-- Ligne dorée décorative -->
  <rect x="0" y="94" width="320" height="6" rx="3" fill="url(#accentGold)"/>
  
  <!-- Icône Coeur / Manette -->
  <g transform="translate(18, 24)" filter="url(#glow)">
    <circle cx="26" cy="26" r="26" fill="#1C9ED6" opacity="0.3"/>
    <path d="M26 12 C18 4, 6 16, 16 28 L26 38 L36 28 C46 16, 34 4, 26 12 Z" fill="#FFD000"/>
    <circle cx="21" cy="20" r="2" fill="#0C1829"/>
    <circle cx="31" cy="20" r="2" fill="#0C1829"/>
  </g>
  
  <!-- Textes -->
  <text x="82" y="44" font-family="'Montserrat', sans-serif, Arial" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="0.5" filter="url(#glow)">FAIRE UN DON</text>
  <text x="82" y="68" font-family="'Montserrat', sans-serif, Arial" font-size="12" font-weight="700" fill="#70D3FF" letter-spacing="0.3">EXTRA LIFE • ENFANT SOLEIL</text>
</svg>