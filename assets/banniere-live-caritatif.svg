<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081424"/>
      <stop offset="40%" stop-color="#142C4B"/>
      <stop offset="100%" stop-color="#060E1A"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7CA2"/>
      <stop offset="50%" stop-color="#1C9ED6"/>
      <stop offset="100%" stop-color="#62AF0F"/>
    </linearGradient>
    <filter id="shadowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="480" fill="url(#bgBanner)"/>
  
  <!-- Cadre lumineux -->
  <rect x="20" y="20" width="1160" height="440" rx="24" fill="none" stroke="#1C9ED6" stroke-width="3" opacity="0.8"/>
  <rect x="40" y="440" width="1120" height="8" rx="4" fill="url(#cyanLine)"/>
  
  <!-- Lueur de fond -->
  <circle cx="600" cy="180" r="280" fill="#1C9ED6" opacity="0.08"/>

  <!-- Badge Supérieur -->
  <g transform="translate(600, 85)" text-anchor="middle" filter="url(#shadowB)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#0C1829" stroke="#FFD000" stroke-width="2"/>
    <text y="7" font-family="'Montserrat', sans-serif, Arial" font-size="16" font-weight="900" fill="#FFD000" letter-spacing="2">✨ EN DIRECT POUR LA CAUSE ✨</text>
  </g>

  <!-- Titre Principal -->
  <text x="600" y="210" text-anchor="middle" font-family="'Montserrat', sans-serif, Arial" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="1" filter="url(#shadowB)">
    LES ALLIÉS DU SOLEIL
  </text>
  
  <!-- Sous-titre -->
  <text x="600" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif, Arial" font-size="28" font-weight="800" fill="#70D3FF" letter-spacing="0.5" filter="url(#shadowB)">
    Campagne Officielle Extra Life • Opération Enfant Soleil
  </text>

  <!-- Slogan -->
  <text x="600" y="345" text-anchor="middle" font-family="'Montserrat', sans-serif, Arial" font-size="24" font-weight="700" fill="#FFD000" letter-spacing="0.5">
    « Le rêve d'un enfant au bout des doigts »
  </text>

  <!-- Mention bas de page -->
  <text x="600" y="405" text-anchor="middle" font-family="'Montserrat', sans-serif, Arial" font-size="16" font-weight="700" fill="#99C3E6" opacity="0.9">
    Rejoignez le mouvement caritatif • Soutenez notre équipe en stream
  </text>
</svg>